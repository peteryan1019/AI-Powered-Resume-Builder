name: Publish Backend to GHCR

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - assets/**
      - docker-compose.yml
      - .github/workflows/build-backend.yml
  workflow_dispatch:

env:
  IMAGE_NAME: backend-resumebuilder-peteryan1019

jobs:
  # Gate: nothing is built or shipped unless the full CI suite passes.
  ci:
    uses: ./.github/workflows/ci.yml

  push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build from the repo root so both backend/ and assets/ are in context.
      - name: Build image
        run: |
          docker build . \
            --file backend/Dockerfile \
            --tag "$IMAGE_NAME" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}"

      - name: Log into GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GitHub Container Registry
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag $IMAGE_NAME $IMAGE_ID:${{ github.sha }}
          docker tag $IMAGE_NAME $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest

  deploy:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to the droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/resumebuilder/
          overwrite: true

      - name: Pull images and restart containers on the droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/resumebuilder
            test -f .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose config --quiet
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
