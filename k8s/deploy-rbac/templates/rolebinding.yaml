apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resumebuilder-keda-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: resumebuilder
    app.kubernetes.io/component: deployment-rbac
subjects:
  - kind: Group
    name: {{ .Values.groupName | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: resumebuilder-keda-deployer
  apiGroup: rbac.authorization.k8s.io
