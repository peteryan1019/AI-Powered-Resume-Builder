apiVersion: v1
kind: Service
metadata:
  name: resumebuilder-frontend
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: resumebuilder-frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resumebuilder-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
