apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumebuilder-frontend
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: resumebuilder-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumebuilder-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumebuilder-frontend
        app.kubernetes.io/part-of: resumebuilder
    spec:
      serviceAccountName: resumebuilder-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- include "resumebuilder-app.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "resumebuilder-app.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
