apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumebuilder-worker
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: resumebuilder-worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.autoscaling.minReplicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumebuilder-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumebuilder-worker
        app.kubernetes.io/part-of: resumebuilder
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: resumebuilder-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- include "resumebuilder-app.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "resumebuilder-app.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["node", "--import", "tsx", "src/resume-workflow/start-worker.ts"]
          ports:
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: resumebuilder-config
          env:
            {{- range $name := list "DATABASE_URL" "REDIS_URL" "REDIS_PASSWORD" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $name }}
            {{- end }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/google/service-account.json
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: google-cloud-credentials
              mountPath: /var/run/secrets/google
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: google-cloud-credentials
          secret:
            secretName: {{ .Values.googleCredentialsSecret }}
