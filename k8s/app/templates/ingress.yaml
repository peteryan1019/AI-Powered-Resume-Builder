{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumebuilder
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required when ingress.enabled=true" .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: resumebuilder-api
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: resumebuilder-api
                port:
                  name: http
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: resumebuilder-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resumebuilder-frontend
                port:
                  name: http
{{- end }}
