apiVersion: v1
kind: ConfigMap
metadata:
  name: resumebuilder-config
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: "3000"
  WORKER_HEALTH_PORT: "3001"
  RESUME_WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  SESSION_TTL_SECONDS: {{ .Values.config.sessionTtlSeconds | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
  GOOGLE_CLOUD_PROJECT: {{ required "config.googleCloudProject is required" .Values.config.googleCloudProject | quote }}
  GOOGLE_CLOUD_LOCATION: {{ .Values.config.googleCloudLocation | default "global" | quote }}
  REDIS_ADDRESS: redis:6379
