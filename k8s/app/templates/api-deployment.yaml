apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumebuilder-api
  labels:
    {{- include "resumebuilder-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: resumebuilder-api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumebuilder-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumebuilder-api
        app.kubernetes.io/part-of: resumebuilder
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: resumebuilder-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      {{- include "resumebuilder-app.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "resumebuilder-app.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: resumebuilder-config
          env:
            {{- range $name := list "DATABASE_URL" "REDIS_URL" "SECRETKEY" "RESEND_API_KEY" "MAIL_FROM" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "STRIPE_SECRET_KEY" "STRIPE_WEBHOOK_SECRET" "STRIPE_PRICE_ID" "APIKEY_2" "APIKEY_3" "COACH_KEY" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $name }}
            {{- end }}
            - name: WRITER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WRITER_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            # Kubernetes removes a terminating Pod from Service endpoints first.
            # This pause gives the ALB time to observe that before SIGTERM starts
            # the application's own request drain.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
