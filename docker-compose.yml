x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10
    restart: unless-stopped
    container_name: nginx-proxy
    labels:
      - "com.github.nginx-proxy.nginx"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    logging: *default-logging

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:2.6.3
    restart: unless-stopped
    container_name: nginx-proxy-acme
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: "${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}"
    logging: *default-logging

  db:
    image: postgres:17
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumebuilder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumebuilder"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  backend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/backend-resumebuilder-peteryan1019:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 3000
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/resumebuilder"
      REDIS_URL: "redis://redis:6379"
      SECRETKEY: "${SECRETKEY:?SECRETKEY must be set}"
      FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL must be set}"
      BACKEND_URL: "${BACKEND_URL:?BACKEND_URL must be set}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      MAIL_FROM: "${MAIL_FROM}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      STRIPE_PRICE_ID: "${STRIPE_PRICE_ID}"
      APIKEY_1: "${APIKEY_1}"
      APIKEY_2: "${APIKEY_2}"
      APIKEY_3: "${APIKEY_3}"
      COACH_KEY: "${COACH_KEY:?COACH_KEY must be set}"
    logging: *default-logging

  resume-worker:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/backend-resumebuilder-peteryan1019:latest
    container_name: resume-worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/resume-workflow/worker.ts"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/resumebuilder"
      REDIS_URL: "redis://redis:6379"
      RESUME_WORKER_CONCURRENCY: "${RESUME_WORKER_CONCURRENCY:-2}"
      APIKEY_1: "${APIKEY_1}"
      APIKEY_2: "${APIKEY_2}"
      COACH_KEY: "${COACH_KEY:?COACH_KEY must be set}"
    logging: *default-logging

  frontend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/frontend-resumebuilder-peteryan1019:latest
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - 80
    environment:
      VIRTUAL_HOST: "${APP_DOMAIN:?APP_DOMAIN must be set}"
      LETSENCRYPT_HOST: "${APP_DOMAIN:?APP_DOMAIN must be set}"
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
