x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10
    restart: unless-stopped
    container_name: nginx-proxy
    labels:
      - "com.github.nginx-proxy.nginx"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    logging: *default-logging

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:2.6.3
    restart: unless-stopped
    container_name: nginx-proxy-acme
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: "${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}"
    logging: *default-logging

  db:
    image: postgres:17
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumebuilder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumebuilder"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # Run schema migrations exactly once before either long-running backend
  # process starts. Kubernetes will use the same image/command in a Job.
  migrate:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/backend-resumebuilder-peteryan1019:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/resumebuilder"
    logging: *default-logging

  backend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/backend-resumebuilder-peteryan1019:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - 3000
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/resumebuilder"
      REDIS_URL: "redis://redis:6379"
      SECRETKEY: "${SECRETKEY:?SECRETKEY must be set}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-604800}"
      FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL must be set}"
      BACKEND_URL: "${BACKEND_URL:?BACKEND_URL must be set}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY must be set}"
      MAIL_FROM: "${MAIL_FROM:?MAIL_FROM must be set}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}"
      STRIPE_PRICE_ID: "${STRIPE_PRICE_ID:?STRIPE_PRICE_ID must be set}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT must be set}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-global}"
      GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/google/service-account.json"
    volumes:
      - "${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS must point to a service-account JSON file}:/var/run/secrets/google/service-account.json:ro"
    logging: *default-logging

  resume-worker:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/backend-resumebuilder-peteryan1019:latest
    container_name: resume-worker
    restart: unless-stopped
    # Invoke Node directly so it receives Kubernetes/Docker's SIGTERM as PID 1.
    command: ["node", "--import", "tsx", "src/resume-workflow/start-worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/resumebuilder"
      REDIS_URL: "redis://redis:6379"
      RESUME_WORKER_CONCURRENCY: "${RESUME_WORKER_CONCURRENCY:-2}"
      WORKER_HEALTH_PORT: "3001"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT must be set}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-global}"
      GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/google/service-account.json"
    volumes:
      - "${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS must point to a service-account JSON file}:/var/run/secrets/google/service-account.json:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *default-logging

  frontend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/frontend-resumebuilder-peteryan1019:latest
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - 80
    environment:
      VIRTUAL_HOST: "${APP_DOMAIN:?APP_DOMAIN must be set}"
      LETSENCRYPT_HOST: "${APP_DOMAIN:?APP_DOMAIN must be set}"
      # The image defaults to static-only routing for Kubernetes, where the ALB
      # sends API paths directly to the backend Service. Compose still needs its
      # frontend Nginx to proxy those paths to the backend container.
      PROXY_API_TO_BACKEND: "true"
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
