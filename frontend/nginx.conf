server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow larger request bodies (resume data, PDF uploads, etc.).
  client_max_body_size 20M;

  # Docker's embedded DNS, so nginx resolves "backend" at request time instead
  # of failing to start if the backend container isn't up yet.
  resolver 127.0.0.11 valid=30s;

  # ---- Backend routes (same origin, reverse-proxied to the backend container) ----
  # $request_uri keeps the full original path + query string.

  location /api/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /auth/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /webhooks/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # ---- Angular SPA: serve static files, fall back to index.html for routes ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
