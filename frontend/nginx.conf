server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow larger request bodies (resume data, PDF uploads, etc.).
  client_max_body_size 20M;

  # Kubernetes' ALB routes /api, /auth, and /webhooks directly to the backend
  # Service. This container serves only the Angular application and assets.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
