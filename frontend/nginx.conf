server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow larger request bodies (resume data, PDF uploads, etc.).
  client_max_body_size 20M;

  # Kubernetes' ALB routes /api, /auth, and /webhooks directly to the backend
  # Service. This container serves only the Angular application and assets.
  # nginx:alpine's bundled MIME table does not currently map the .mjs
  # extension. PDF.js loads its worker as an ES module, and browsers refuse to
  # execute that worker when it is served as application/octet-stream.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
