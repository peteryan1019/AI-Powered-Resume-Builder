<!-- app.html -->
<div class="container">
  
  <!-- 1. The Title in Blue -->
  <h1 class="welcome-title">Welcome to the Resume Builder</h1>

  <!-- 2. The Interactive Button -->
  <!-- (click)="addUser()" listens for clicks and runs the method in your app.ts -->
  <button class="add-user-btn" (click)="addUser()" [disabled]="isLoading()">
  {{ isLoading() ? 'Adding...' : 'Test Add a User' }}
</button>

<div class="counter-box">
  <span class="counter-label">Total Registered Users</span>
  <div class="counter-number">{{ userCount() }}</div>
</div>

<p *ngIf="errorMessage()">{{ errorMessage() }}</p>

</div>

<router-outlet></router-outlet>
