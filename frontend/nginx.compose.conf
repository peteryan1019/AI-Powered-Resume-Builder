server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20M;

  # Docker Compose has no ALB. Its embedded DNS resolves the backend container,
  # so frontend Nginx preserves the same-origin API behavior used in production.
  resolver 127.0.0.11 valid=30s;

  location /api/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /auth/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /webhooks/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # PDF.js runs its worker as an ES module. The nginx:alpine MIME table does
  # not map .mjs, so declare it explicitly instead of serving executable
  # JavaScript as application/octet-stream.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
